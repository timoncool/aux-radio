[Radio]
; Станция, которую занимает AUX Radio (её имя в колесе меняет установщик через GXT2).
Station=RADIO_02_POP
; Подпись в уведомлениях и на дисплее радио.
StationLabel=AUX
; Как глушить штатную музыку станции (как у MichonGoddijn231849/gta-spotify-radio):
;   Scene        - штатная аудио-сцена, глушащая радио (из MuteScenes, первая активная)
;   Freeze       - заморозить ленту станции
;   VehicleOff   - держать радио машины в OFF (проверенный способ; колесо в эфире показывает OFF)
;   DisableRadio - выключить радио машины целиком (альтернатива VehicleOff, не проверено)
; Проверено на ПК (DEEPSEEK-RESULT-3): Scene,Freeze глушит Pop, колесо показывает AUX Radio.
; VehicleOff добавлять, только если Pop вдруг слышна (колесо тогда покажет OFF).
MuteStrategies=Scene,Freeze
; Имена сцен сверены с DurtyFree/gta-v-data-dumps audioSceneNames.json.
MuteScenes=CAR_MOD_RADIO_MUTE_SCENE,MP_JOB_CHANGE_RADIO_MUTE,MUTES_RADIO_SCENE

[Audio]
; Кто играет поток плеера:
;   Game   - сама игра (звук внутри процесса GTA V) — основной режим
;   Agent  - агент в трее (тот же звук, то же устройство) — если вывод из игры даёт проблемы
;   Remote - без захвата: плеер играет сам, мод только глушит Pop и ставит плеер на play/pause
Output=Game
; Подстройка громкости под штатные станции, дБ.
VolumeDb=-6.0
; Ползунок «Музыка» 0..10 -> громкость: (x/10)^SliderCurve.
SliderCurve=2.0
; Приглушение во время разговоров, звонков и реплик, дБ.
DialogueDuckDb=-11.0
; Глухой салон закрытой машины (Гц). Мото, лодки и кабриолеты с опущенной крышей — без фильтра.
InteriorCutoffHz=15000
; Длительность плавных переходов, мс.
FadeMs=90

[Display]
; Трек в штатной ленте уведомлений при смене трека.
TrackNotifications=true
; Трек на штатном дисплее радио в машине (Scaleform dashboard, SET_RADIO).
Dashboard=true
; Трек плеера в центре колеса радио вместо трека Pop. Мод в эфире временно занимает две самые
; длинные метки таблицы треков игры и возвращает их текст, когда эфир заканчивается.
WheelTrack=true

[Controls]
; Работают только когда в машине включена AUX Radio. F9 не используется: это меню RageCoop.
PlayPause=F7
Next=F8
Previous=F6
